<svg xmlns="http://www.w3.org/2000/svg" width="300" height="214" viewBox="0 0 300 214">
  <defs>
    <linearGradient id="abd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2c20"/>
      <stop offset="1" stop-color="#241a12"/>
    </linearGradient>
    <radialGradient id="lantern" cx="50%" cy="60%" r="60%">
      <stop offset="0" stop-color="#fbffd6"/>
      <stop offset="0.55" stop-color="#e9ff7a"/>
      <stop offset="1" stop-color="#b8e83a"/>
    </radialGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f27a5e"/>
      <stop offset="1" stop-color="#d4523e"/>
    </linearGradient>
  </defs>
  <!-- antennae -->
  <path d="M150 58 C142 40 132 24 116 12" fill="none" stroke="#2a1f17" stroke-width="5" stroke-linecap="round"/>
  <path d="M160 58 C168 40 178 24 194 12" fill="none" stroke="#2a1f17" stroke-width="5" stroke-linecap="round"/>
  <circle cx="116" cy="12" r="5" fill="#3b2c20"/>
  <circle cx="194" cy="12" r="5" fill="#3b2c20"/>
  <!-- head -->
  <ellipse cx="155" cy="64" rx="11" ry="10" fill="#1f1712"/>
  <circle cx="148" cy="62" r="3" fill="#5b4a3c"/>
  <circle cx="162" cy="62" r="3" fill="#5b4a3c"/>
  <!-- abdomen -->
  <rect x="140" y="96" width="30" height="108" rx="15" fill="url(#abd)"/>
  <path d="M141 118 H169 M141 136 H169 M141 152 H169" stroke="#4d3a2b" stroke-width="2.5"/>
  <!-- the lantern: the glowing tail -->
  <path d="M140.5 160 H169.5 V189 a14.5 14.5 0 0 1 -29 0 Z" fill="url(#lantern)"/>
  <path d="M141 174 H169" stroke="#cdea5c" stroke-width="2" opacity="0.7"/>
  <ellipse cx="150" cy="172" rx="4" ry="9" fill="#ffffff" opacity="0.55"/>
  <!-- pronotum: the shield behind the head, red with a dark spot -->
  <path d="M131 86 C131 74 142 70 155 70 C168 70 179 74 179 86 C179 98 168 102 155 102 C142 102 131 98 131 86 Z" fill="url(#shield)" stroke="#f4c45a" stroke-width="3"/>
  <ellipse cx="155" cy="84" rx="8" ry="7" fill="#2a1f17"/>
  <ellipse cx="146" cy="80" rx="4" ry="2.5" fill="#ffffff" opacity="0.35"/>
</svg>
